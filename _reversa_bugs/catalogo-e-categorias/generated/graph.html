<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Reversa Bugs — Catálogo e Categorias</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; margin: 2rem; background: #0f172a; color: #f8fafc; }
    h1 { color: #38bdf8; border-bottom: 2px solid #1e293b; padding-bottom: 0.5rem; }
    .card { background: #1e293b; border-radius: 12px; padding: 1.5rem; margin-top: 1.5rem; border: 1px solid #334155; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { text-align: left; padding: 0.75rem; border-bottom: 1px solid #334155; }
    th { color: #94a3b8; font-size: 0.85rem; text-transform: uppercase; }
    .badge { padding: 0.25rem 0.6rem; border-radius: 6px; font-size: 0.78rem; font-weight: bold; }
    .badge-open { background: #fef3c7; color: #92400e; }
    .badge-p1 { background: #fee2e2; color: #991b1b; }
    a { color: #38bdf8; text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <h1>🐛 Reversa Bugs — Contexto: Catálogo e Categorias</h1>
  <div class="card">
    <h2>Bugs Registrados</h2>
    <table>
      <thead>
        <tr>
          <th>ID Canônico</th>
          <th>#</th>
          <th>Título</th>
          <th>Severidade</th>
          <th>Prioridade</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td><strong>BUG-20260809-C4T1</strong></td>
          <td>#1</td>
          <td>Dropdown de categorias no formulário do Admin não exibe nem vincula categorias das abas do /home</td>
          <td>Medium</td>
          <td><span class="badge badge-p1">P1</span></td>
          <td><span class="badge badge-open">Open</span></td>
        </tr>
      </tbody>
    </table>
  </div>
</body>
</html>
